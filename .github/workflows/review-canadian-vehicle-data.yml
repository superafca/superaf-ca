name: Review Canadian vehicle data
on:
  push:
    branches: [sandbox/site-rebuild-2026-10-08]
    paths: [.github/workflows/review-canadian-vehicle-data.yml]
permissions:
  contents: read
jobs:
  catalog:
    if: github.repository == 'superafca/superaf-ca' && github.ref == 'refs/heads/sandbox/site-rebuild-2026-10-08'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Download and validate official public year make model evidence
        run: |
          python3 - <<'PY'
          import csv,io,json,hashlib,urllib.request,urllib.parse
          from pathlib import Path
          root=Path('vehicle-data-review');root.mkdir()
          base='https://open.canada.ca/data/dataset/98f1a129-f628-4ce4-b24d-6f16bf24dd64/resource/'
          inputs=[
            ('historical','42495676-28b7-40f3-b0e0-3d7fe005ca56','my1995-2014-fuel-consumption-ratings-5-cycle.csv',1995,2014),
            ('2015-2024','c98b9dc8-b23f-4cd8-8b19-e892da1e4688','my2015-2024-fuel-consumption-ratings.csv',2015,2024),
            ('2025','d589f2bc-9a85-4f65-be2f-20f17debfcb1','my2025-fuel-consumption-ratings.csv',2025,2025),
            ('2026','9df1b18d-d036-4783-a61c-99f1f75b3ac5','my2026-fuel-consumption-ratings.csv',2026,2026),
            ('ev','026e45b4-eb63-451f-b34f-d9308ea3a3d9','my2012-2026-battery-electric-vehicles.csv',2012,2026),
            ('phev','8812228b-a6aa-4303-b3d0-66489225120d','my2012-2026-plug-in-hybrid-electric-vehicles.csv',2012,2026)
          ]
          entries={};sources=[]
          for name,rid,filename,lo,hi in inputs:
            url=base+rid+'/download/'+filename
            req=urllib.request.Request(url,headers={'User-Agent':'SUPERAF public catalogue review; Python urllib'})
            with urllib.request.urlopen(req,timeout=30) as r:
              resolved=r.url; parsed=urllib.parse.urlparse(resolved);host=parsed.hostname or ''
              print('Public source resolved to '+resolved,flush=True)
              if parsed.scheme!='https' or not (host.endswith('.gc.ca') or host.endswith('.canada.ca') or host=='open.canada.ca'):raise ValueError('Unreviewed redirect host: '+host)
              blob=r.read(5000001)
            if len(blob)>5000000 or b'<html' in blob[:500].lower():raise ValueError('Invalid CSV payload')
            (root/filename).write_bytes(blob)
            try:text=blob.decode('utf-8-sig')
            except UnicodeDecodeError:text=blob.decode('cp1252')
            rows=list(csv.reader(io.StringIO(text)))
            valid=[]
            for row in rows:
              if len(row)<3 or not row[0].strip().isdigit():continue
              year=int(row[0].strip())
              if not lo<=year<=hi:continue
              make,model=(row[1].strip(),row[2].strip())
              if not make or not model or any(ord(c)<32 for c in make+model):raise ValueError('Malformed model row')
              valid.append((year,make,model))
              if year>=2000:entries.setdefault((year,make,model),set()).add(name)
            if not valid:raise ValueError('No valid records in '+name)
            sources.append({'id':name,'url':url,'resolvedUrl':resolved,'bytes':len(blob),'sha256':hashlib.sha256(blob).hexdigest(),'rawRows':len(valid),'years':sorted({v[0] for v in valid})})
          years=sorted({k[0] for k in entries})
          if years!=list(range(2000,2027)):raise ValueError('Missing model years')
          data={'schema':1,'market':'CA','kind':'model-year-evidence-not-complete-trims','minYear':2000,'maxYear':2026,'sources':sources,'records':[[*key,sorted(value)] for key,value in sorted(entries.items())],'attribution':'Contains information licensed under the Open Government Licence – Canada. Source: Natural Resources Canada fuel consumption ratings. Model names preserved; not a complete retail trim or heavy-duty inventory.','licence':'https://open.canada.ca/en/open-government-licence-canada'}
          out=root/'nrcan-model-years.json';out.write_text(json.dumps(data,ensure_ascii=False,separators=(',',':')),encoding='utf-8')
          print(json.dumps({'records':len(entries),'years':years,'sources':sources,'sha256':hashlib.sha256(out.read_bytes()).hexdigest()}))
          PY
      - name: Preserve read-only source review
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canadian-vehicle-data-review
          path: vehicle-data-review
          retention-days: 7
          if-no-files-found: error
